  <text x="242" y="530" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">6 languages</text>
  <circle cx="405" cy="526" r="3" fill="#475569" />
  <text x="422" y="530" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">Free quotes</text>
  <!-- URL -->
  <text x="1120" y="530" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#D4603A" text-anchor="end">terrassea.com</text>
