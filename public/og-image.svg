<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4603A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8845c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Accent bar -->
  <rect x="80" y="200" width="80" height="4" rx="2" fill="url(#accent)" />
  <!-- Title -->
  <text x="80" y="260" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">TerrasseaHUB</text>
  <!-- Subtitle -->
  <text x="80" y="320" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">Europe's B2B Marketplace for</text>
  <text x="80" y="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="400" fill="#94a3b8">Outdoor Hospitality Furniture</text>
  <!-- Tags -->
  <rect x="80" y="410" width="120" height="36" rx="18" fill="#D4603A" opacity="0.15" />
  <text x="140" y="434" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#D4603A" text-anchor="middle">Chairs</text>
  <rect x="216" y="410" width="120" height="36" rx="18" fill="#D4603A" opacity="0.15" />
  <text x="276" y="434" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#D4603A" text-anchor="middle">Tables</text>
  <rect x="352" y="410" width="140" height="36" rx="18" fill="#D4603A" opacity="0.15" />
  <text x="422" y="434" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#D4603A" text-anchor="middle">Parasols</text>
  <rect x="508" y="410" width="170" height="36" rx="18" fill="#D4603A" opacity="0.15" />
  <text x="593" y="434" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#D4603A" text-anchor="middle">Sun Loungers</text>
  <rect x="694" y="410" width="120" height="36" rx="18" fill="#D4603A" opacity="0.15" />
  <text x="754" y="434" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#D4603A" text-anchor="middle">Sofas</text>
